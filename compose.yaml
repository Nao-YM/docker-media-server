services:
  serviio:
    image:
      serviio
    build:
      context: ./Serviio
    container_name: Serviio
    network_mode: host
    environment:
      TZ: Asia/Tokyo
    volumes:
      - /mnt/work1/records:/media1
      - /mnt/record/records:/media2
      - /mnt/record/converted_records:/media3
      - ./Serviio/config:/opt/Serviio/config
      - ./Serviio/library:/opt/Serviio/library
      - ./Serviio/log:/opt/Serviio/log
      - ./Serviio/plugins:/opt/Serviio/plugins
      - ./Serviio/media:/media/Serviio
    logging:
      # ログはjournaldで記録する。
      driver: journald
      options:
        tag: serviio

  jellyfin:
    image: jellyfin/jellyfin
    container_name: Jellyfin
    network_mode: host
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./Jellyfin/config:/config
      - ./Jellyfin/cache:/cache
      - /mnt/work1/records:/media1
      - /mnt/record/records:/media2
      - /mnt/record/converted_records:/media3
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      # - type: bind
      #   source: /path/to/fonts
      #   target: /usr/local/share/fonts/custom
      #   read_only: true
    devices:
      - /dev/dri:/dev/dri
    # Optional - alternative address used for autodiscovery
    # environment:
    #   - JELLYFIN_PublishedServerUrl=http://example.com
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: always
    logging:
      driver: journald
      options:
        tag: jellyfin